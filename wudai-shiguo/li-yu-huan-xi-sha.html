        <h1 class="poem-page-title">浣溪沙·红日已高三丈透</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>红日已高三丈透，</p>
        
        
        
        <p>金炉次第添香兽。</p>
        
        
        
        <p>红锦地衣随步皱。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>佳人舞点金钗溜，</p>
        
        
        
        <p>酒恶时拈花蕊嗅。</p>
        
        
        
        <p>别殿遥闻箫鼓奏。</p>
        
        
    </div>
