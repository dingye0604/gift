    <header class="poem-header">
        <h1 class="poem-page-title">浪淘沙·帘外雨潺潺</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>帘外雨潺潺，春意阑珊。罗衾不耐五更寒。</p>
        
        
        
        <p>梦里不知身是客，一晌贪欢。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>独自莫凭栏，无限江山。别时容易见时难。</p>
        
        
        
        <p>流水落花春去也，天上人间。</p>
        
        
    </div>
