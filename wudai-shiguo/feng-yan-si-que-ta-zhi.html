    <header class="poem-header">
        <h1 class="poem-page-title">鹊踏枝·谁道闲情抛掷久</h1>
        <div class="poem-page-meta">
            <span>冯延巳</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>谁道闲情抛掷久？每到春来，惆怅还依旧。</p>
        
        
        
        <p>日日花前常病酒，不辞镜里朱颜瘦。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>河畔青芜堤上柳，为问新愁，何事年年有？</p>
        
        
        
        <p>独立小桥风满袖，平林新月人归后。</p>
        
        
    </div>
