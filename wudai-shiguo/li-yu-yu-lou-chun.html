        <h1 class="poem-page-title">玉楼春·晚妆初了明肌雪</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>晚妆初了明肌雪，春殿嫔娥鱼贯列。</p>
        
        
        
        <p>凤箫吹断水云闲，重按霓裳歌遍彻。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>临风谁更飘香屑，醉拍阑干情味切。</p>
        
        
        
        <p>归时休放烛花红，待踏马蹄清夜月。</p>
        
        
    </div>
