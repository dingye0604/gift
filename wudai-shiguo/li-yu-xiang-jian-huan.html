        <h1 class="poem-page-title">相见欢·无言独上西楼</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>

            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>

    <div class="poem-text">
        
        
        <p>无言独上西楼，月如钩。</p>
        
        
        
        <p>寂寞梧桐深院锁清秋。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>剪不断，理还乱，是离愁。</p>
        
        
        
        <p>别是一般滋味在心头。</p>
        
        
    </div>
