        <h1 class="poem-page-title">虞美人·春花秋月何时了</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>春花秋月何时了？往事知多少。</p>
        
        
        
        <p>小楼昨夜又东风，故国不堪回首月明中。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>雕栏玉砌应犹在，只是朱颜改。</p>
        
        
        
        <p>问君能有几多愁？恰似一江春水向东流。</p>
        
        
    </div>
