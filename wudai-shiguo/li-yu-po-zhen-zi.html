        <h1 class="poem-page-title">破阵子·四十年来家国</h1>
        <div class="poem-page-meta">
            <span>李煜</span>
            <span class="meta-sep">·</span>
            <span>五代十国</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>四十年来家国，三千里地山河。</p>
        
        
        
        <p>凤阁龙楼连霄汉，玉树琼枝作烟萝，几曾识干戈？</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>一旦归为臣虏，沈腰潘鬓消磨。</p>
        
        
        
        <p>最是仓皇辞庙日，教坊犹奏别离歌，垂泪对宫娥。</p>
        
        
    </div>
