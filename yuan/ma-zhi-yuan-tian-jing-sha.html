    <header class="poem-header">
        <h1 class="poem-page-title">天净沙·秋思</h1>
        <div class="poem-page-meta">
            <span>马致远</span>
            <span class="meta-sep">·</span>
            <span>元</span>
            
            <span class="meta-sep">·</span>
            <span>散曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>枯藤<sup>1</sup>老树昏鸦<sup>2</sup>，小桥流水人家，古道<sup>3</sup>西风瘦马。</p>
        
        
        
        <p>夕阳西下，断肠人<sup>4</sup>在天涯<sup>5</sup>。</p>
        
        
    </div>

    
    <div class="poem-annotations">
        
        <p><span class="ann-num">1.</span> 枯藤：干枯的藤蔓。枯萎的植物暗示深秋的萧瑟。</p>
        
        <p><span class="ann-num">2.</span> 昏鸦：黄昏时归巢的乌鸦。昏，指天色昏暗。乌鸦在古诗词中常代表荒凉和不祥。</p>
        
        <p><span class="ann-num">3.</span> 古道：古老荒凉的道路。与&#34;西风&#34;&#34;瘦马&#34;组合，写旅途的艰辛。</p>
        
        <p><span class="ann-num">4.</span> 断肠人：形容极度悲伤的人。断肠，肝肠寸断，古人认为悲伤至极会使肠子断裂。</p>
        
        <p><span class="ann-num">5.</span> 天涯：天边，极远的地方。在天涯，意味着远离家乡亲人。</p>
        
    </div>
