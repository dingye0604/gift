    <header class="poem-header">
        <h1 class="poem-page-title">天净沙·秋</h1>
        <div class="poem-page-meta">
            <span>白朴</span>
            <span class="meta-sep">·</span>
            <span>元</span>
            
            <span class="meta-sep">·</span>
            <span>散曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>孤村落日残霞<sup>1</sup>，轻烟老树寒鸦<sup>2</sup>，一点飞鸿影下<sup>3</sup>。</p>
        
        
        
        <p>青山绿水，白草红叶黄花<sup>4</sup>。</p>
        
        
    </div>

    
    <div class="poem-annotations">
        
        <p><span class="ann-num">1.</span> 残霞：即将消散的晚霞。与&#34;落日&#34;照应，点出黄昏时分。</p>
        
        <p><span class="ann-num">2.</span> 寒鸦：秋寒中的乌鸦。白朴的&#34;寒鸦&#34;与马致远的&#34;昏鸦&#34;着眼不同——一个强调寒冷，一个强调昏暗。</p>
        
        <p><span class="ann-num">3.</span> 飞鸿：大雁。鸿雁南飞是秋天的典型意象。&#34;影下&#34;写雁群飞过，影子掠过地面。</p>
        
        <p><span class="ann-num">4.</span> 白草红叶黄花：白色的草（经霜后枯萎变白）、红色的枫叶、黄色的菊花——三种颜色概括了秋天的多样色彩。</p>
        
    </div>
