    <header class="poem-header">
        <h1 class="poem-page-title">哨遍·高祖还乡（节选）</h1>
        <div class="poem-page-meta">
            <span>睢景臣</span>
            <span class="meta-sep">·</span>
            <span>元</span>
            
            <span class="meta-sep">·</span>
            <span>散曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>社长排门告示，但有的差使无推故，这差使不寻俗。</p>
        
        
        
        <p>一壁厢纳草也根，一边又要差夫，索应付。</p>
        
        
        
        <p>又言是车驾，都说是銮舆，今日还乡故。</p>
        
        
        
        <p>王乡老执定瓦台盘，赵忙郎抱着酒胡芦。</p>
        
        
        
        <p>新刷来的头巾，恰糨来的绸衫，畅好是妆幺大户。</p>
        
        
    </div>
