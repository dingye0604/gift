    <header class="poem-header">
        <h1 class="poem-page-title">山坡羊·潼关怀古</h1>
        <div class="poem-page-meta">
            <span>张养浩</span>
            <span class="meta-sep">·</span>
            <span>元</span>
            
            <span class="meta-sep">·</span>
            <span>散曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>峰峦如聚，波涛如怒，山河表里潼关路。</p>
        
        
        
        <p>望西都，意踌躇。</p>
        
        
        
        <p>伤心秦汉经行处，宫阙万间都做了土。</p>
        
        
        
        <p>兴，百姓苦；亡，百姓苦。</p>
        
        
    </div>
