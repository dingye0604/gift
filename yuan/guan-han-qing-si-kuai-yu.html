    <header class="poem-header">
        <h1 class="poem-page-title">四块玉·别情</h1>
        <div class="poem-page-meta">
            <span>关汉卿</span>
            <span class="meta-sep">·</span>
            <span>元</span>
            
            <span class="meta-sep">·</span>
            <span>散曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>自送别，心难舍，一点相思几时绝？</p>
        
        
        
        <p>凭阑袖拂杨花雪<sup>1</sup>。</p>
        
        
        
        <p>溪又斜<sup>2</sup>，山又遮<sup>3</sup>，人去也！</p>
        
        
    </div>

    
    <div class="poem-annotations">
        
        <p><span class="ann-num">1.</span> 杨花雪：杨花（柳絮）飘飞如雪花。&#34;凭阑袖拂&#34;——靠着栏杆，用袖子拂开飘来的杨花。</p>
        
        <p><span class="ann-num">2.</span> 溪又斜：溪水弯弯曲曲流向远方。斜（xiá），此处与&#34;遮&#34;&#34;也&#34;押韵。溪水蜿蜒，视线随之延伸。</p>
        
        <p><span class="ann-num">3.</span> 山又遮：山峦层层遮挡。溪水拐弯后，又被山挡住——远行的人已经消失在山水之外。</p>
        
    </div>
