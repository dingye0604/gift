<article class="poem-page">
    <header class="poem-header">
        <h1 class="poem-page-title">沁园春·长沙</h1>
        <div class="poem-page-meta">
            <span>毛泽东</span>
            <span class="meta-sep">·</span>
            <span>近代</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>独立寒秋，湘江北去，橘子洲头。</p>
        
        
        
        <p>看万山红遍，层林尽染；漫江碧透，百舸争流。</p>
        
        
        
        <p>鹰击长空，鱼翔浅底，万类霜天竞自由。</p>
        
        
        
        <p>怅寥廓，问苍茫大地，谁主沉浮？</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>携来百侣曾游。忆往昔峥嵘岁月稠。</p>
        
        
        
        <p>恰同学少年，风华正茂；书生意气，挥斥方遒。</p>
        
        
        
        <p>指点江山，激扬文字，粪土当年万户侯。</p>
        
        
        
        <p>曾记否，到中流击水，浪遏飞舟？</p>
        
        
    </div>
