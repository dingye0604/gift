    <header class="poem-header">
        <h1 class="poem-page-title">黄海舟中日人索句并见日俄战争地图</h1>
        <div class="poem-page-meta">
            <span>秋瑾</span>
            <span class="meta-sep">·</span>
            <span>近代</span>
            
            <span class="meta-sep">·</span>
            <span>七言律诗</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>万里乘风去复来，只身东海挟春雷。</p>
        
        
        
        <p>忍看图画移颜色，肯使江山付劫灰。</p>
        
        
        
        <p>浊酒难销忧国泪，救时应仗出群才。</p>
        
        
        
        <p>拼将十万头颅血，须把乾坤力挽回。</p>
        
        
    </div>
