        <article class="poem-page">
            <header class="poem-header">
                <h1 class="poem-page-title">己亥杂诗·其五</h1>
                <div class="poem-page-meta">
                    <span>龚自珍</span>
                    <span class="meta-sep">·</span>
                    <span>近代</span>
                    
                    <span class="meta-sep">·</span>
                    <span>七言绝句</span>
                    
                </div>
            </header>

            <div class="poem-text">
                
                
                <p>浩荡<sup>1</sup>离愁白日斜，吟鞭<sup>2</sup>东指即天涯<sup>3</sup>。</p>
                
                
                
                <p>落红<sup>4</sup>不是无情物，化作春泥更护花<sup>5</sup>。</p>
                
                
            </div>

            
            <div class="poem-annotations">
                
                <p><span class="ann-num">1.</span> 浩荡：广阔浩大。形容离愁不是一点半点，而是弥漫天地。</p>
                
                <p><span class="ann-num">2.</span> 吟鞭：诗人的马鞭。一边吟诗一边挥鞭策马东行。</p>
                
                <p><span class="ann-num">3.</span> 即天涯：就是天涯。离开京城（北京）东归杭州，感觉像去往天涯一般遥远。</p>
                
                <p><span class="ann-num">4.</span> 落红：落花。凋谢的花瓣。诗人以落花自比——离开官场如同花儿凋谢。</p>
                
                <p><span class="ann-num">5.</span> 化作春泥更护花：落花融入泥土变成春天的肥料，反而能养护新开的花。比喻自己虽然离开官场，仍会以另一种方式报效国家。</p>
                
            </div>
