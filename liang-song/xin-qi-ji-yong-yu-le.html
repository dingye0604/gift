    <header class="poem-header">
        <h1 class="poem-page-title">永遇乐·京口北固亭怀古</h1>
        <div class="poem-page-meta">
            <span>辛弃疾</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>千古江山，英雄无觅，孙仲谋处。</p>
        
        
        
        <p>舞榭歌台，风流总被，雨打风吹去。</p>
        
        
        
        <p>斜阳草树，寻常巷陌，人道寄奴曾住。</p>
        
        
        
        <p>想当年，金戈铁马，气吞万里如虎。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>元嘉草草，封狼居胥，赢得仓皇北顾。</p>
        
        
        
        <p>四十三年，望中犹记，烽火扬州路。</p>
        
        
        
        <p>可堪回首，佛狸祠下，一片神鸦社鼓。</p>
        
        
        
        <p>凭谁问，廉颇老矣，尚能饭否？</p>
        
        
    </div>
