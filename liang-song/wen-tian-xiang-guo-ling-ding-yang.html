    <header class="poem-header">
        <h1 class="poem-page-title">过零丁洋</h1>
        <div class="poem-page-meta">
            <span>文天祥</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>七言律诗</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>辛苦遭逢起一经，干戈寥落四周星。</p>
        
        
        
        <p>山河破碎风飘絮，身世浮沉雨打萍。</p>
        
        
        
        <p>惶恐滩头说惶恐，零丁洋里叹零丁。</p>
        
        
        
        <p>人生自古谁无死？留取丹心照汗青。</p>
        
        
    </div>
