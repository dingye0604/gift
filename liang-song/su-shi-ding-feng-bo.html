    <header class="poem-header">
        <h1 class="poem-page-title">定风波·莫听穿林打叶声</h1>
        <div class="poem-page-meta">
            <span>苏轼</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>莫听穿林打叶声，何妨吟啸且徐行。</p>
        
        
        
        <p>竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>料峭春风吹酒醒，微冷，山头斜照却相迎。</p>
        
        
        
        <p>回首向来萧瑟处，归去，也无风雨也无晴。</p>
        
        
    </div>
