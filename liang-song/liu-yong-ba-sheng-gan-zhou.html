    <header class="poem-header">
        <h1 class="poem-page-title">八声甘州·对潇潇暮雨洒江天</h1>
        <div class="poem-page-meta">
            <span>柳永</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>对潇潇暮雨洒江天，一番洗清秋。</p>
        
        
        
        <p>渐霜风凄紧，关河冷落，残照当楼。</p>
        
        
        
        <p>是处红衰翠减，苒苒物华休。</p>
        
        
        
        <p>唯有长江水，无语东流。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>不忍登高临远，望故乡渺邈，归思难收。</p>
        
        
        
        <p>叹年来踪迹，何事苦淹留？</p>
        
        
        
        <p>想佳人、妆楼颙望，误几回、天际识归舟。</p>
        
        
        
        <p>争知我、倚栏杆处，正恁凝愁！</p>
        
        
    </div>
