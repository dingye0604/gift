<article class="poem-page">
    <header class="poem-header">
        <h1 class="poem-page-title">燕山亭·北行见杏花</h1>
        <div class="poem-page-meta">
            <span>赵佶</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>裁剪冰绡，轻叠数重，淡著胭脂匀注。</p>
        
        
        
        <p>新样靓妆，艳溢香融，羞杀蕊珠宫女。</p>
        
        
        
        <p>易得凋零，更多少、无情风雨。</p>
        
        
        
        <p>愁苦。问院落凄凉，几番春暮。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>凭寄离恨重重，这双燕，何曾会人言语。</p>
        
        
        
        <p>天遥地远，万水千山，知他故宫何处。</p>
        
        
        
        <p>怎不思量，除梦里、有时曾去。</p>
        
        
        
        <p>无据。和梦也、有时不做。</p>
        
        
    </div>
