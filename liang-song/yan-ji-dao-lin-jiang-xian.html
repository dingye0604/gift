    <header class="poem-header">
        <h1 class="poem-page-title">临江仙·梦后楼台高锁</h1>
        <div class="poem-page-meta">
            <span>晏几道</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>梦后楼台高锁，酒醒帘幕低垂。去年春恨却来时。</p>
        
        
        
        <p>落花人独立，微雨燕双飞。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>记得小蘋初见，两重心字罗衣。琵琶弦上说相思。</p>
        
        
        
        <p>当时明月在，曾照彩云归。</p>
        
        
    </div>
