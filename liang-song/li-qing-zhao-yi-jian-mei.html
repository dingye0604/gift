    <header class="poem-header">
        <h1 class="poem-page-title">一剪梅·红藕香残玉簟秋</h1>
        <div class="poem-page-meta">
            <span>李清照</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>红藕香残玉簟秋。轻解罗裳，独上兰舟。</p>
        
        
        
        <p>云中谁寄锦书来？雁字回时，月满西楼。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>花自飘零水自流。一种相思，两处闲愁。</p>
        
        
        
        <p>此情无计可消除，才下眉头，却上心头。</p>
        
        
    </div>
