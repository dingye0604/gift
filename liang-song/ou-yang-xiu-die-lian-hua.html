    <header class="poem-header">
        <h1 class="poem-page-title">蝶恋花·庭院深深深几许</h1>
        <div class="poem-page-meta">
            <span>欧阳修</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>庭院深深深几许？杨柳堆烟，帘幕无重数。</p>
        
        
        
        <p>玉勒雕鞍游冶处，楼高不见章台路。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>雨横风狂三月暮，门掩黄昏，无计留春住。</p>
        
        
        
        <p>泪眼问花花不语，乱红飞过秋千去。</p>
        
        
    </div>
