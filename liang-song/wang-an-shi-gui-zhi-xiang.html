    <header class="poem-header">
        <h1 class="poem-page-title">桂枝香·金陵怀古</h1>
        <div class="poem-page-meta">
            <span>王安石</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>登临送目，正故国晚秋，天气初肃。</p>
        
        
        
        <p>千里澄江似练，翠峰如簇。</p>
        
        
        
        <p>归帆去棹残阳里，背西风、酒旗斜矗。</p>
        
        
        
        <p>彩舟云淡，星河鹭起，画图难足。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>念往昔、繁华竞逐。叹门外楼头，悲恨相续。</p>
        
        
        
        <p>千古凭高对此，谩嗟荣辱。</p>
        
        
        
        <p>六朝旧事随流水，但寒烟、芳草凝绿。</p>
        
        
        
        <p>至今商女，时时犹唱，后庭遗曲。</p>
        
        
    </div>
