        <h1 class="poem-page-title">如梦令·昨夜雨疏风骤</h1>
        <div class="poem-page-meta">
            <span>李清照</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>昨夜雨疏风骤，浓睡不消残酒。</p>
        
        
        
        <p>试问卷帘人，却道海棠依旧。</p>
        
        
        
        <p>知否，知否？应是绿肥红瘦。</p>
