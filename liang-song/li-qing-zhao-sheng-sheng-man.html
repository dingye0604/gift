<article class="poem-page">
    <header class="poem-header">
        <h1 class="poem-page-title">声声慢·寻寻觅觅</h1>
        <div class="poem-page-meta">
            <span>李清照</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>寻寻觅觅，冷冷清清，凄凄惨惨戚戚。</p>
        
        
        
        <p>乍暖还寒时候，最难将息。</p>
        
        
        
        <p>三杯两盏淡酒，怎敌他、晚来风急。</p>
        
        
        
        <p>雁过也，正伤心，却是旧时相识。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>满地黄花堆积，憔悴损，如今有谁堪摘？</p>
        
        
        
        <p>守着窗儿，独自怎生得黑？</p>
        
        
        
        <p>梧桐更兼细雨，到黄昏、点点滴滴。</p>
        
        
        
        <p>这次第，怎一个愁字了得！</p>
        
        
    </div>
