    <header class="poem-header">
        <h1 class="poem-page-title">青玉案·元夕</h1>
        <div class="poem-page-meta">
            <span>辛弃疾</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>东风夜放花千树，更吹落，星如雨。</p>
        
        
        
        <p>宝马雕车香满路。</p>
        
        
        
        <p>凤箫声动，玉壶光转，一夜鱼龙舞。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>蛾儿雪柳黄金缕，笑语盈盈暗香去。</p>
        
        
        
        <p>众里寻他千百度，</p>
        
        
        
        <p>蓦然回首，那人却在，灯火阑珊处。</p>
        
        
    </div>
