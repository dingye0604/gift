    <header class="poem-header">
        <h1 class="poem-page-title">念奴娇·赤壁怀古</h1>
        <div class="poem-page-meta">
            <span>苏轼</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>大江东去，浪淘尽，千古风流人物。</p>
        
        
        
        <p>故垒西边，人道是，三国周郎赤壁。</p>
        
        
        
        <p>乱石穿空，惊涛拍岸，卷起千堆雪。</p>
        
        
        
        <p>江山如画，一时多少豪杰。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>遥想公瑾当年，小乔初嫁了，雄姿英发。</p>
        
        
        
        <p>羽扇纶巾，谈笑间，樯橹灰飞烟灭。</p>
        
        
        
        <p>故国神游，多情应笑我，早生华发。</p>
        
        
        
        <p>人生如梦，一尊还酹江月。</p>
        
        
    </div>
