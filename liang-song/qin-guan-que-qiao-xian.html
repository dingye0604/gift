        <h1 class="poem-page-title">鹊桥仙·纤云弄巧</h1>
        <div class="poem-page-meta">
            <span>秦观</span>
            <span class="meta-sep">·</span>
            <span>两宋</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>纤云弄巧，飞星传恨，银汉迢迢暗度。</p>
        
        
        
        <p>金风玉露一相逢，便胜却人间无数。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>柔情似水，佳期如梦，忍顾鹊桥归路。</p>
        
        
        
        <p>两情若是久长时，又岂在朝朝暮暮。</p>
        
        
    </div>
