        <div class="poem-page-meta">
            <span>纳兰性德</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>

    <div class="poem-text">
        
        
        <p>谁念西风独自凉，萧萧黄叶闭疏窗，沉思往事立残阳。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>被酒莫惊春睡重，赌书消得泼茶香，当时只道是寻常。</p>
