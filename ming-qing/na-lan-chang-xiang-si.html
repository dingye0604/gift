        <div class="poem-page-meta">
            <span>纳兰性德</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>

    <div class="poem-text">
        
        
        <p>山一程，水一程，身向榆关那畔行，夜深千帐灯。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>风一更，雪一更，聒碎乡心梦不成，故园无此声。</p>
