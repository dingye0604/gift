    <header class="poem-header">
        <h1 class="poem-page-title">木兰花令·拟古决绝词</h1>
        <div class="poem-page-meta">
            <span>纳兰性德</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>人生若只如初见，何事秋风悲画扇。</p>
        
        
        
        <p>等闲变却故人心，却道故人心易变。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>骊山语罢清宵半，泪雨霖铃终不怨。</p>
        
        
        
        <p>何如薄幸锦衣郎，比翼连枝当日愿。</p>
        
        
    </div>
