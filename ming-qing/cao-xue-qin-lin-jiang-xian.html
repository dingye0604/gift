    <header class="poem-header">
        <h1 class="poem-page-title">临江仙·柳絮</h1>
        <div class="poem-page-meta">
            <span>曹雪芹（借薛宝钗之手）</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>白玉堂前春解舞，东风卷得均匀。</p>
        
        
        
        <p>蜂围蝶阵乱纷纷。几曾随逝水？岂必委芳尘？</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>万缕千丝终不改，任他随聚随分。</p>
        
        
        
        <p>韶华休笑本无根。好风凭借力，送我上青云。</p>
        
        
    </div>
