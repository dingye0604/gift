    <header class="poem-header">
        <h1 class="poem-page-title">红豆曲</h1>
        <div class="poem-page-meta">
            <span>曹雪芹（借贾宝玉之手）</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>曲</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>滴不尽相思血泪抛红豆，开不完春柳春花满画楼，</p>
        
        
        
        <p>睡不稳纱窗风雨黄昏后，忘不了新愁与旧愁，</p>
        
        
        
        <p>咽不下玉粒金莼噎满喉，照不见菱花镜里形容瘦。</p>
        
        
        
        <p>展不开的眉头，捱不明的更漏。</p>
        
        
        
        <p>呀！恰便似遮不住的青山隐隐，流不断的绿水悠悠。</p>
        
        
    </div>
