<article class="poem-page">
    <header class="poem-header">
        <h1 class="poem-page-title">牡丹亭·惊梦（节选）</h1>
        <div class="poem-page-meta">
            <span>汤显祖</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>戏曲唱词</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>原来姹紫嫣红开遍，似这般都付与断井颓垣。</p>
        
        
        
        <p>良辰美景奈何天，赏心乐事谁家院。</p>
        
        
        
        <p>朝飞暮卷，云霞翠轩；雨丝风片，烟波画船——锦屏人忒看的这韶光贱！</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>遍青山啼红了杜鹃，荼蘼外烟丝醉软。</p>
        
        
        
        <p>牡丹虽好，他春归怎占的先！</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>不到园林，怎知春色如许？</p>
        
        
    </div>
