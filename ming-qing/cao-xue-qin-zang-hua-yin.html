    <header class="poem-header">
        <h1 class="poem-page-title">葬花吟（节选）</h1>
        <div class="poem-page-meta">
            <span>曹雪芹（借林黛玉之手）</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>七言古诗</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>花谢花飞花满天，红消香断有谁怜？</p>
        
        
        
        <p>游丝软系飘春榭，落絮轻沾扑绣帘。</p>
        
        
        
        <p>闺中女儿惜春暮，愁绪满怀无释处。</p>
        
        
        
        <p>手把花锄出绣帘，忍踏落花来复去。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>……</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>一年三百六十日，风刀霜剑严相逼。</p>
        
        
        
        <p>明媚鲜妍能几时，一朝漂泊难寻觅。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>……</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>未若锦囊收艳骨，一抔净土掩风流。</p>
        
        
        
        <p>质本洁来还洁去，强于污淖陷渠沟。</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>……</p>
        
        
        
        <div class="poem-stanza-break"></div>
        
        
        
        <p>侬今葬花人笑痴，他年葬侬知是谁？</p>
        
        
        
        <p>试看春残花渐落，便是红颜老死时。</p>
        
        
        
        <p>一朝春尽红颜老，花落人亡两不知！</p>
        
        
    </div>
