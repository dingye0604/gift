    <header class="poem-header">
        <h1 class="poem-page-title">桃花庵歌</h1>
        <div class="poem-page-meta">
            <span>唐寅</span>
            <span class="meta-sep">·</span>
            <span>明清</span>
            
            <span class="meta-sep">·</span>
            <span>七言古诗</span>
            
        </div>
    </header>

    <div class="poem-text">
        
        
        <p>桃花坞里桃花庵，桃花庵下桃花仙。</p>
        
        
        
        <p>桃花仙人种桃树，又摘桃花换酒钱。</p>
        
        
        
        <p>酒醒只在花前坐，酒醉还来花下眠。</p>
        
        
        
        <p>半醉半醒日复日，花落花开年复年。</p>
        
        
        
        <p>但愿老死花酒间，不愿鞠躬车马前。</p>
        
        
        
        <p>车尘马足富者趣，酒盏花枝贫者缘。</p>
        
        
        
        <p>若将富贵比贫者，一在平地一在天。</p>
        
        
        
        <p>若将贫贱比车马，他得驱驰我得闲。</p>
        
        
        
        <p>别人笑我忒风颠，我笑他人看不穿。</p>
        
        
        
        <p>不见五陵豪杰墓，无花无酒锄作田。</p>
        
        
    </div>
